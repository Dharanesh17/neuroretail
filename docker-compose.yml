services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuroretail-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuroretail-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
